<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Moona Terminal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
  <style>
    :root { color-scheme: dark; --bar: #111827; --line: #243042; --text: #d7e0ee; --muted: #95a3b8; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #05070a; color: var(--text); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { display: flex; flex-direction: column; }
    #topbar { min-height: 42px; display: flex; align-items: center; gap: 8px; padding: 6px 8px calc(6px + env(safe-area-inset-top)); background: var(--bar); border-bottom: 1px solid var(--line); }
    /* Session tabs: one per live daemon session; tap to switch which terminal
       this page is mirroring. Each tab is labelled with the session's live
       terminal title (falling back to the command). Scrolls horizontally when
       there are more tabs than fit — the bar owns the row's flexible width and
       pans on touch, with the scrollbar hidden for a clean look. */
    #tabs { display: flex; gap: 4px; overflow-x: auto; flex: 1 1 auto; min-width: 0; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    #tabs::-webkit-scrollbar { display: none; }
    .tab { flex: 0 0 auto; max-width: 44vw; border: 1px solid var(--line); background: #0d1420; color: var(--muted); padding: 5px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tab.active { background: #1b2740; color: var(--text); border-color: #38bdf8; }
    /* New-session button: always visible so an all-exited phone is never a dead
       end and you can start work (e.g. claude) without going back to the PC. */
    #addtab { flex: 0 0 auto; width: 32px; padding: 5px 0; border: 1px solid var(--line); background: #0d1420; color: var(--text); border-radius: 8px; font-size: 16px; font-weight: 700; line-height: 1; }
    #addtab:active { background: #1b2740; }
    /* The grid is pinned to the native terminal's size (not the device's), so on
       a narrow phone it can be wider than the screen; this wrap owns HORIZONTAL
       panning (overflow-x). VERTICAL scrolling is deliberately NOT native: xterm's
       Viewport snaps scrollTop to a whole-row boundary on every scroll frame
       (Viewport.ts _innerRefresh), which cancels the browser's fling momentum the
       instant you lift your finger — so a fast swipe "scrolls a bit then stops".
       We therefore forbid native pan-y (touch-action omits pan-y) and drive
       vertical scrolling ourselves with a real inertial handler (see enableInertialTouchScroll).
       Keep pan-x for the wide grid and pinch-zoom for readability. */
    #terminal-wrap { flex: 1; min-height: 0; padding: 8px 8px 4px; overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; touch-action: pan-x pinch-zoom; }
    #terminal { width: 100%; height: 100%; }
    #keys { display: flex; gap: 6px; overflow-x: auto; padding: 6px 8px calc(8px + env(safe-area-inset-bottom)); background: var(--bar); border-top: 1px solid var(--line); -webkit-overflow-scrolling: touch; }
    button { flex: 0 0 auto; border: 1px solid #334155; background: #182235; color: var(--text); padding: 9px 12px; border-radius: 10px; font-weight: 650; font-size: 13px; }
    button:active { transform: translateY(1px); background: #24324b; }
    .xterm { height: 100%; }
    /* Native, momentum vertical scroll (smooth on Android; a manual JS handler
       stutters and has no inertia). touch-action:pan-x pan-y lets a vertical swipe
       scroll this viewport while a horizontal swipe chains up to #terminal-wrap for
       column panning. overscroll-behavior:contain stops a scroll from leaking to
       the page (address-bar wobble). -webkit-overflow-scrolling gives iOS inertia. */
    /* overflow-y:auto keeps the scroll-area xterm needs; touch-action omits pan-y
       because we drive vertical scroll via JS (enableInertialTouchScroll) rather
       than native scroll — see the #terminal-wrap note for why native fling dies. */
    .xterm .xterm-viewport { overflow-y: auto; touch-action: pan-x pinch-zoom; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
    @media (max-width: 640px) {
      #topbar { min-height: 38px; }
      button { padding: 9px 11px; }
      #terminal-wrap { padding: 6px 6px 2px; }
    }
    /* --- JuiceSSH-style grid keyboard (mobile) --- */
    #kb { background: var(--bar); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
    /* Cap the keyboard so the terminal always keeps the majority of the screen;
       the grid scrolls internally if the keys don't all fit. */
    #kb-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 6px 8px; max-height: 38vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .kb-key { position: relative; display: flex; align-items: center; justify-content: center; text-align: center; background: transparent; border: 0; color: var(--text); font-family: inherit; font-size: 16px; font-weight: 600; line-height: 1.15; padding: 12px 6px; border-radius: 12px; -webkit-user-select: none; user-select: none; touch-action: manipulation; white-space: pre-line; }
    .kb-key:active { background: #1c2740; }
    .kb-key.sym { color: var(--muted); font-size: 18px; }
    .kb-key.wide { grid-column: 1 / -1; color: var(--muted); font-size: 15px; }
    /* Modifier keys show an underline that lights up when armed/locked. */
    .kb-key.mod::after { content: ''; position: absolute; bottom: 9px; left: 50%; transform: translateX(-50%); width: 20px; height: 2px; border-radius: 2px; background: #3a465c; }
    .kb-key.mod.armed::after { background: #38bdf8; }
    .kb-key.mod.locked::after { background: #0ea5e9; height: 3px; }
    .kb-divider { grid-column: 1 / -1; height: 1px; background: var(--line); margin: 4px; opacity: .6; }
    /* Desktop drives a real keyboard: don't show the on-screen one at all. */
    @media (pointer: fine) and (hover: hover) { #kb { display: none; } }
    /* When the phone's native keyboard is up, hide ours so they never stack. */
    body.osk-up #kb { display: none; }
    /* Access-code login: shown INSTEAD of a dead terminal when the daemon needs a
       token we don't have. Scanning the QR provides it automatically; typing the
       bare URL lands here and asks for the code once. */
    #login { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; background: rgba(5,7,10,.94); padding: 24px; }
    #login.show { display: flex; }
    .login-card { width: 100%; max-width: 340px; background: var(--bar); border: 1px solid var(--line); border-radius: 16px; padding: 24px 22px; text-align: center; }
    .login-title { font-weight: 800; font-size: 22px; letter-spacing: .04em; }
    .login-sub { color: var(--muted); font-size: 13px; margin: 10px 0 18px; line-height: 1.45; }
    #login-input { width: 100%; padding: 13px 14px; border-radius: 10px; border: 1px solid #334155; background: #0d1420; color: var(--text); font-size: 16px; font-family: inherit; text-align: center; letter-spacing: .04em; }
    #login-go { width: 100%; margin-top: 12px; padding: 13px; border-radius: 10px; border: 1px solid #334155; background: #0d1420; color: var(--text); font-weight: 700; font-size: 15px; }
    #login-go:active { transform: translateY(1px); }
    #login-scan { width: 100%; padding: 13px; border-radius: 10px; border: 1px solid #38bdf8; background: #1b2740; color: var(--text); font-weight: 700; font-size: 15px; }
    #login-scan:active { transform: translateY(1px); }
    .login-or { color: var(--muted); font-size: 12px; margin: 14px 0; letter-spacing: .12em; text-transform: uppercase; }
    #login-err { color: #f38ba8; font-size: 12px; min-height: 16px; margin-top: 10px; }
    #scanner { position: fixed; inset: 0; z-index: 60; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #000; padding: 20px; }
    #scanner.show { display: flex; }
    #scan-video { width: 100%; max-width: 480px; max-height: 68vh; border-radius: 16px; object-fit: cover; background: #05070a; }
    #scan-hint { color: #e6edf6; font-size: 14px; text-align: center; line-height: 1.4; }
    #scan-cancel { padding: 12px 28px; border-radius: 10px; border: 1px solid var(--line); background: var(--bar); color: var(--text); font-weight: 700; font-size: 15px; }
    #scan-cancel:active { transform: translateY(1px); }
  </style>
</head>
<body>
  <div id="topbar">
    <div id="tabs"></div>
    <button id="addtab" title="Start a new session">＋</button>
  </div>
  <div id="terminal-wrap"><div id="terminal"></div></div>
  <div id="kb"><div id="kb-grid"></div></div>

  <div id="login">
    <div class="login-card">
      <div class="login-title">moona</div>
      <div class="login-sub">Scan the QR shown in your terminal — or enter the access code below.</div>
      <button id="login-scan">📷&nbsp; Scan QR code</button>
      <div class="login-or">or</div>
      <input id="login-input" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="access code" />
      <button id="login-go">Connect</button>
      <div id="login-err"></div>
    </div>
  </div>

  <div id="scanner">
    <video id="scan-video" playsinline autoplay muted></video>
    <div id="scan-hint">Point your camera at the QR code in your terminal</div>
    <button id="scan-cancel">Cancel</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
  <script>
    const statusEl = document.getElementById('status');
    const params = new URLSearchParams(location.search);
    // The app token rides in the URL (?token=...) from the QR/link. Persist it
    // per-origin so a bookmarked BARE url (e.g. https://moona.nguyenvu.dev) keeps
    // working without the query string. First tokened visit stores it; later bare
    // visits reuse it. Clears if the daemon ever rejects it (see below).
    let token = params.get('token') || '';
    try {
      if (token) localStorage.setItem('moona_token', token);
      else token = localStorage.getItem('moona_token') || '';
    } catch (e) {}
    const term = new Terminal({
      cursorBlink: true,
      // NOTE: no convertEol. The ConPTY stream carries its own CR/LF and cursor
      // positioning; rewriting \n to \r\n (as convertEol does) mangles a
      // repainting TUI's output over time. The real console (moona attach)
      // renders the same bytes cleanly precisely because it does not do this.
      fontFamily: 'Cascadia Mono, Consolas, Menlo, Monaco, monospace',
      fontSize: window.innerWidth < 640 ? 13 : 14,
      theme: { background: '#05070a', foreground: '#d7e0ee', cursor: '#f8fafc', selectionBackground: '#334155' },
      // Deep scrollback so the history the server replays on connect (see the
      // 'replay' handler) isn't truncated — this is what a phone scrolls up into,
      // since a browser client has no native console scrollback of its own.
      scrollback: 10000,
      allowProposedApi: true
    });
    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminal'));
    term.focus();

    // True when the viewport is pinned to the live bottom row. Used to guard the
    // various scrollToBottom() calls so a user who has scrolled UP into history
    // isn't yanked back down by the next resize / keyboard toggle / font refit.
    function isAtBottom() {
      try { const b = term.buffer.active; return b.viewportY >= b.baseY; }
      catch (e) { return true; }
    }
    // --- Inertial touch scrolling (mobile) ---
    // Native touch scroll is unusable here: xterm's Viewport snaps scrollTop to a
    // whole-row boundary every scroll frame (Viewport.ts _innerRefresh), which
    // cancels the browser's fling momentum the moment you lift off — a fast swipe
    // "scrolls a bit then stops". So we forbid native pan-y (see CSS) and own the
    // vertical gesture: track finger velocity, scroll by whole rows as pixels
    // accumulate, and on release run a friction-decayed fling. Unlike the earlier
    // per-move scrollLines(±1) (no inertia, fought the native scroller), this
    // tracks 1:1 with the finger and coasts like a normal page. Horizontal panning
    // and pinch-zoom stay native (touch-action: pan-x pinch-zoom).
    (function enableInertialTouchScroll() {
      if (!matchMedia('(pointer: coarse)').matches) return; // touch devices only
      const surface = document.getElementById('terminal-wrap');
      let rowH = 18;
      function rowHeight() {
        try {
          const vp = document.querySelector('.xterm-viewport');
          if (vp && term.rows > 0) { const h = vp.clientHeight / term.rows; if (h > 4) rowH = h; }
        } catch (e) {}
        return rowH;
      }
      // Physics matched to xterm.js/VS Code's own touch scroller (Monaco Gesture,
      // ported to xterm src/browser/scrollable/touch.ts): release velocity is
      // averaged over a rolling window of the last ~4 touch samples, and the fling
      // decelerates LINEARLY at 0.005 px/ms^2 until it stops. (An exponential decay
      // coasts differently and never truly halts.)
      const FRICTION = 0.005; // px/ms^2, linear deceleration — the xterm constant
      let active = false, decided = false, vertical = false;
      let startX = 0, startY = 0, lastY = 0, accum = 0, raf = null;
      const rY = [], rT = []; // rolling samples (clientY, timestamp) for velocity
      function stopFling() { if (raf) { cancelAnimationFrame(raf); raf = null; } }
      // Positive px => finger moved up => scroll toward newer lines (scrollLines +).
      function applyPixels(px) {
        accum += px;
        const rh = rowHeight();
        const rows = accum < 0 ? Math.ceil(accum / rh) : Math.floor(accum / rh);
        if (rows !== 0) { accum -= rows * rh; term.scrollLines(rows); }
      }
      function atEdge(dir) { // dir>0 scrolling down/newer, dir<0 up/older
        try { const b = term.buffer.active; return dir > 0 ? b.viewportY >= b.baseY : b.viewportY <= 0; }
        catch (e) { return false; }
      }
      function sample(y, t) { rY.push(y); rT.push(t); if (rY.length > 4) { rY.shift(); rT.shift(); } }
      surface.addEventListener('touchstart', (e) => {
        if (e.touches.length !== 1) { active = false; return; } // let pinch through
        stopFling();
        active = true; decided = false; vertical = false;
        const t = e.touches[0];
        startX = t.clientX; startY = t.clientY; lastY = t.clientY;
        accum = 0; rY.length = 0; rT.length = 0; sample(t.clientY, e.timeStamp);
      }, { passive: true });
      surface.addEventListener('touchmove', (e) => {
        if (!active || e.touches.length !== 1) return;
        const t = e.touches[0];
        if (!decided) {
          const dyT = startY - t.clientY, dxT = startX - t.clientX;
          if (Math.abs(dyT) < 6 && Math.abs(dxT) < 6) return; // wait for a clear axis
          decided = true; vertical = Math.abs(dyT) >= Math.abs(dxT);
          if (!vertical) { active = false; return; } // horizontal → native pan-x
        }
        e.preventDefault(); // we own the vertical gesture (listener is non-passive)
        applyPixels(lastY - t.clientY); // track the finger 1:1
        lastY = t.clientY; sample(t.clientY, e.timeStamp);
      }, { passive: false });
      surface.addEventListener('touchend', (e) => {
        if (!active || !vertical) { active = false; return; }
        active = false;
        // Release velocity over the rolling window, in scroll-space (finger up = +).
        const dT = rT[rT.length - 1] - rT[0];
        if (dT <= 0) return;
        let v = (rY[0] - rY[rY.length - 1]) / dT;    // px/ms, signed
        v = Math.max(-8, Math.min(8, v));            // sanity clamp
        if (Math.abs(v) < 0.05) return;              // too slow to fling
        let last = e.timeStamp;
        const step = (now) => {
          const dt = Math.max(1, now - last); last = now;
          const dec = FRICTION * dt;                 // linear velocity bleed
          v = v > 0 ? Math.max(0, v - dec) : Math.min(0, v + dec);
          if (v === 0 || atEdge(v > 0 ? 1 : -1)) { raf = null; return; }
          applyPixels(v * dt);
          raf = requestAnimationFrame(step);
        };
        raf = requestAnimationFrame(step);
      }, { passive: true });
    })();

    let ws = null;
    let reconnectTimer = null;
    let resizeTimer = null;
    // Session tab state. The daemon can hold many sessions; this page mirrors one
    // at a time and lets you switch between them like tabs.
    let sessions = [];
    let activeId = params.get('session') || (location.hash ? location.hash.slice(1) : '') || null;
    const tabsEl = document.getElementById('tabs');

    function setStatus(text) { if (statusEl) statusEl.textContent = text; }
    function apiQuery() { return token ? ('?token=' + encodeURIComponent(token)) : ''; }
    function wsURL() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const p = new URLSearchParams();
      if (activeId) p.set('session', activeId);
      if (token) p.set('token', token);
      const q = p.toString();
      return proto + '//' + location.host + '/ws' + (q ? '?' + q : '');
    }

    function renderTabs() {
      if (!tabsEl) return;
      tabsEl.innerHTML = '';
      for (const s of sessions) {
        const b = document.createElement('button');
        b.className = 'tab' + (s.id === activeId ? ' active' : '');
        // Prefer the live terminal title (set via OSC 0/2 by the running program
        // and refreshed by the server as it changes). Fall back to the command's
        // basename until a title arrives. textContent avoids any HTML-escaping.
        const cmdName = (s.command || '').split(/[\\/]/).pop() || s.command || '';
        b.textContent = (s.title && s.title.trim()) || cmdName || 'session';
        b.title = s.title || s.command || '';
        b.addEventListener('click', () => selectSession(s.id));
        tabsEl.appendChild(b);
      }
    }

    function selectSession(id) {
      if (!id || id === activeId) return;
      activeId = id;
      try { history.replaceState(null, '', '#' + id); } catch (e) {}
      renderTabs();
      if (ws) { try { ws.close(); } catch (e) {} ws = null; }
      clearTimeout(reconnectTimer);
      term.reset();
      lastReqCols = 0; lastReqRows = 0; lastEffCols = 0; lastEffRows = 0;
      connect();
    }

    // Reconcile the tab bar with a session list (from an HTTP fetch or a pushed
    // {type:'sessions'} frame). Keeps the current selection if it still exists;
    // otherwise falls back to the first session, or the empty state.
    function applySessions(list) {
      sessions = Array.isArray(list) ? list : [];
      if (!activeId || !sessions.find(s => s.id === activeId)) {
        const first = sessions[0];
        if (first) { selectSession(first.id); }
        else { activeId = null; if (ws) { try { ws.close(); } catch (e) {} ws = null; } setStatus('no sessions — tap ＋ to start one'); }
      }
      renderTabs();
      // Protect every tab we now show (including ones started elsewhere that just
      // appeared) from the idle reaper right away, not only on the next interval.
      sendKeepalive();
    }
    async function refreshSessions() {
      try {
        const r = await fetch('/api/sessions' + apiQuery());
        if (r.status === 401) {
          // We have no valid token. Instead of a dead terminal, show a friendly
          // "enter access code" prompt. A wrong stored token is cleared so a fresh
          // code (or a QR scan) can replace it.
          const hadToken = !!token;
          try { localStorage.removeItem('moona_token'); } catch (e) {}
          token = '';
          showLogin(hadToken ? 'That code was not accepted — try again.' : '');
          return;
        }
        if (!r.ok) throw new Error('http ' + r.status);
        applySessions(await r.json());
      } catch (e) { return; }
    }
    // Start a new session from the phone. The daemon spawns it (default shell, or a
    // command you type — e.g. "claude"), so you never have to walk back to the PC.
    async function addSession() {
      let cmd;
      try { cmd = window.prompt('Command to run (blank = shell):', 'claude'); }
      catch (e) { cmd = ''; }
      if (cmd === null) return; // cancelled
      setStatus('starting...');
      try {
        const r = await fetch('/api/sessions' + apiQuery(), {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ cmd: (cmd || '').trim() })
        });
        if (!r.ok) throw new Error('http ' + r.status);
        const out = await r.json();
        await refreshSessions();
        if (out && out.id) selectSession(out.id);
        setStatus('started session ' + ((out && out.id) || ''));
      } catch (e) { setStatus('could not start session'); }
    }
    function send(msg) {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
    }
    function sendInput(data) { send({ type: 'input', data }); }
    // The size we last REQUESTED from the server (our natural fit). This is only
    // a request: the server picks the effective size (min across all clients)
    // and echoes it back via a {type:'size'} message, which is the ONLY thing
    // that actually resizes our grid. See the size handler below.
    let lastReqCols = 0, lastReqRows = 0;
    // The effective grid the server told us the app is rendering at. xterm's
    // grid is kept EXACTLY equal to this at all times, because Claude Code's
    // renderer emits purely cursor-relative deltas against a screen whose
    // dimensions == the ConPTY size. If our grid diverges from the ConPTY even
    // by one row, every incremental frame's cursor math drifts and the output
    // rots "after a moment". So the server is authoritative on grid size.
    let lastEffCols = 0, lastEffRows = 0;
    function fitAndResize() {
      // Measure our natural fit WITHOUT mutating the grid (proposeDimensions
      // does not resize; fitAddon.fit() would, and that must never race the
      // server's authoritative size). Send it as a request only.
      let dims;
      try { dims = fitAddon.proposeDimensions(); } catch (e) {}
      if (!dims || !dims.cols || !dims.rows) return;
      if (dims.cols === lastReqCols && dims.rows === lastReqRows) return;
      lastReqCols = dims.cols;
      lastReqRows = dims.rows;
      send({ type: 'resize', cols: dims.cols, rows: dims.rows });
    }
    // The grid is pinned to the authoritative native-terminal size (often narrower
    // AND shorter than a desktop browser window, or wider than a phone). We can't
    // change cols/rows (the grid MUST stay == the ConPTY or Claude Code's
    // cursor-relative frames rot — see the size handler), so instead we scale the
    // FONT to make the whole authoritative grid fill the available space. Fitting
    // the font — rather than CSS-scaling the canvas — keeps the text crisp at any
    // size. This runs on every browser client (desktop + mobile); a native
    // `moona attach` client is the size AUTHORITY and never runs this.
    //
    // Fit policy: grow the font to fill the full WIDTH of the viewport, but never
    // let the grid grow TALLER than the viewport, so the bottom row (the live
    // prompt / input) always stays visible. With a fixed grid that's a single
    // letterbox fit — take the font size that fills the width and the one that
    // fills the height, and use the smaller. Whichever axis is tighter binds; the
    // other gets a little slack (empty margin), which is unavoidable with a fixed
    // aspect ratio.
    const MAX_FONT = 64; // sanity ceiling so a tiny grid can't blow the font up absurdly
    const MIN_FILL_FONT = 9; // below this, filling the width is unreadable -> pan instead
    function fitFontToGrid() {
      if (!lastEffCols || !lastEffRows) return;
      const wrap = document.getElementById('terminal-wrap');
      const w = wrap.clientWidth, h = wrap.clientHeight;
      if (w < 20 || h < 20) return;
      // Only re-pin to the bottom if we were already there — don't yank a user
      // who has scrolled up to read history.
      const pinned = isAtBottom();
      // Derive the real per-font-pixel cell size from the current render so the
      // fit is accurate for this font/renderer; fall back to conservative
      // constants for Cascadia Mono if the internal dims aren't exposed.
      const curFs = term.options.fontSize || 14;
      let cwPerFs = 0.60, chPerFs = 1.34;
      try {
        const cell = term._core._renderService.dimensions.css.cell;
        if (cell && cell.width && cell.height && curFs) {
          cwPerFs = cell.width / curFs;
          chPerFs = cell.height / curFs;
        }
      } catch (e) {}
      // Font that exactly fills the width, and the one that exactly fills the
      // height. The small margins keep us just inside the box so we never trip a
      // scrollbar from sub-pixel rounding.
      const fsWidth  = (w * 0.995) / (lastEffCols * cwPerFs);
      const fsHeight = (h * 0.99)  / (lastEffRows * chPerFs);
      // Fill the width, capped so we never exceed the height. If filling the width
      // would make the font unreadably small (a wide grid on a narrow phone), fall
      // back to fitting the rows to the height and letting the width pan.
      let fs = fsWidth >= MIN_FILL_FONT ? Math.min(fsWidth, fsHeight) : fsHeight;
      fs = Math.max(6, Math.min(fs, MAX_FONT));
      fs = Math.round(fs * 2) / 2;
      if (Math.abs((term.options.fontSize || 0) - fs) >= 0.5) {
        term.options.fontSize = fs;
        try { term.resize(lastEffCols, lastEffRows); } catch (e) {}
      }
      if (pinned) { try { term.scrollToBottom(); } catch (e) {} }
    }
    function scheduleResize() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        // Don't refit while the user is scrolled up into history. On Android the
        // address bar shows/hides as you scroll, which fires resize/visualViewport
        // events; refitting the font here would resize the grid mid-scroll and make
        // it jump and stutter. Defer the cosmetic refit until they're back at the
        // live bottom. (A real ConPTY size change still applies immediately in the
        // 'size' handler — that path is mandatory and independent of this one.)
        if (!isAtBottom()) return;
        fitAndResize(); fitFontToGrid();
      }, 80);
    }
    // ---- History replay ----
    // On attach the server sends one {type:'replay'} frame: base64(gzip(raw
    // scrollback)). We decompress it and write the raw bytes into xterm at the
    // ConPTY size the 'size' frame just set, so the reconstructed screen +
    // scrollback matches the native terminal byte-for-byte. Decompression is async
    // (DecompressionStream), so any live 'output' that arrives mid-decode is parked
    // in pendingOutput and flushed IN ORDER once the history is written — otherwise
    // new output could render above the history.
    let replaying = false;
    let pendingOutput = [];
    function b64ToBytes(b64) {
      const bin = atob(b64 || '');
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }
    async function gunzip(bytes) {
      const ds = new DecompressionStream('gzip');
      const stream = new Blob([bytes]).stream().pipeThrough(ds);
      return new Uint8Array(await new Response(stream).arrayBuffer());
    }
    async function applyReplay(msg) {
      const myWs = ws;                    // the socket this history belongs to
      replaying = true;
      try {
        let bytes = b64ToBytes(msg.data);
        if (msg.enc === 'gzip') bytes = await gunzip(bytes);
        if (ws !== myWs) return;          // switched tab / reconnected mid-decode — drop it
        if (bytes.length) term.write(bytes);
      } catch (e) { /* if history can't be restored, live output still works */ }
      if (ws !== myWs) return;
      const q = pendingOutput; pendingOutput = [];
      for (const d of q) term.write(d);   // flush live output that arrived mid-decode
      replaying = false;
      try { term.scrollToBottom(); } catch (e) {}
    }
    // Tell the server whether the user is currently looking at this tab. A focused
    // browser becomes the ConPTY size AUTHORITY (server side: setActive), so the
    // shared terminal follows whichever screen you're actually on — the phone can
    // shrink the grid to a readable width while you use it, and the moment you
    // background it (switch app, lock, other tab) authority hands back to the
    // native desktop terminal, which snaps clean again. One PTY has one size, so
    // this "follow the focused screen" is the closest thing to per-device sizing.
    function sendActive() {
      send({ type: 'active', active: document.visibilityState === 'visible' });
    }
    document.addEventListener('visibilitychange', sendActive);
    // Tell the daemon which sessions this page still has open as tabs, so the ones
    // we're NOT currently viewing (they have no socket of their own) aren't reaped
    // as abandoned while this page stays open. The daemon closes a session only
    // after it has had no client AND no keepalive for its grace window, so a page
    // left open here keeps all its tabs alive; closing the page lets them be reaped.
    function sendKeepalive() {
      if (!sessions.length) return;
      send({ type: 'keepalive', keepalive: sessions.map(s => s.id) });
    }
    setInterval(sendKeepalive, 30000);
    function connect() {
      clearTimeout(reconnectTimer);
      if (!activeId) { setStatus('no sessions — run "moona claude"'); return; }
      if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
      setStatus('connecting...');
      ws = new WebSocket(wsURL());
      ws.onopen = () => { setStatus('connected'); replaying = false; pendingOutput = []; lastReqCols = 0; lastReqRows = 0; lastEffCols = 0; lastEffRows = 0; fitAndResize(); sendActive(); sendKeepalive(); term.focus(); };
      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'output') { if (replaying) pendingOutput.push(msg.data || ''); else term.write(msg.data || ''); }
          else if (msg.type === 'replay') { applyReplay(msg); }
          else if (msg.type === 'reset') {
            // Server dropped the raw replay; start from a clean slate and let the
            // app repaint the current frame. Reset trackers so we re-request.
            term.reset();
            lastReqCols = 0; lastReqRows = 0; lastEffCols = 0; lastEffRows = 0;
          }
          else if (msg.type === 'size') {
            // Authoritative grid size from the server (min across all clients).
            // Force our xterm grid to EXACTLY match the ConPTY so Claude Code's
            // cursor-relative deltas stay locked and don't drift over time.
            if (msg.cols && msg.rows && (msg.cols !== lastEffCols || msg.rows !== lastEffRows)) {
              const widthChanged = lastEffCols !== 0 && msg.cols !== lastEffCols;
              const pinned = isAtBottom();
              term.resize(msg.cols, msg.rows);
              // A repainting TUI writes to the main screen, so old frames sit in
              // scrollback. On a WIDTH change xterm reflows that scrollback and
              // garbles it (the frames were never soft-wrapped). Drop it; the app
              // repaints the current frame. Height-only changes keep column layout
              // intact, so we preserve history to avoid wiping it on mobile scroll.
              if (widthChanged) term.clear();
              lastEffCols = msg.cols;
              lastEffRows = msg.rows;
              // The grid may be taller/wider than the visible area (it is pinned
              // to the ConPTY/native-terminal size). On mobile, shrink the font so
              // it all fits; then keep the live bottom row — the prompt — in view.
              fitFontToGrid();
              // widthChanged wipes scrollback (term.clear above) so we're at the
              // bottom regardless; otherwise only re-pin if the user already was.
              if (widthChanged || pinned) { try { term.scrollToBottom(); } catch (e) {} }
            }
          }
          else if (msg.type === 'sessions') { applySessions(msg.sessions || []); }
          else if (msg.type === 'status') { setStatus(msg.message || 'connected'); if ((msg.message || '').indexOf('exited') >= 0) refreshSessions(); }
          else if (msg.type === 'error') { setStatus(msg.message || 'error'); term.writeln('\r\n[moona] ' + (msg.message || 'error')); }
          else if (msg.type === 'reload') { location.reload(); }  // dev: web/index.html changed on disk
        } catch (e) {}
      };
      ws.onclose = () => { setStatus('disconnected; reconnecting...'); reconnectTimer = setTimeout(connect, 1200); };
      ws.onerror = () => { setStatus('connection error'); };
    }

    // ---- Mobile keyboard: sticky modifiers + special keys (Termius-style) ----
    const ESC = String.fromCharCode(27);
    const TAB = String.fromCharCode(9);
    const mod = { ctrl: { on: false, lock: false }, alt: { on: false, lock: false }, shift: { on: false, lock: false } };
    // Shift is a sticky modifier like Ctrl/Alt. This bar has no letter keys
    // (letters come from the phone's native keyboard), so Shift's real job here is
    // the shifted CONTROL keys TUIs rely on — above all Shift+Tab (backtab), which
    // Claude Code uses to cycle permission modes. Map each base sequence to its
    // shifted CSI form; sendSeq swaps it in when Shift is armed.
    const SHIFT_SEQ = {
      [TAB]: ESC + '[Z',            // Shift+Tab -> BackTab
      [ESC + '[A']: ESC + '[1;2A',  // Shift+Up
      [ESC + '[B']: ESC + '[1;2B',  // Shift+Down
      [ESC + '[C']: ESC + '[1;2C',  // Shift+Right
      [ESC + '[D']: ESC + '[1;2D',  // Shift+Left
      [ESC + '[H']: ESC + '[1;2H',  // Shift+Home
      [ESC + '[F']: ESC + '[1;2F',  // Shift+End
    };

    function renderMods() {
      for (const name of ['ctrl', 'alt', 'shift']) {
        const el = document.getElementById('mod-' + name);
        if (!el) continue;
        el.classList.toggle('armed', mod[name].on && !mod[name].lock);
        el.classList.toggle('locked', mod[name].lock);
      }
    }
    // Tap cycle: off -> armed (one-shot) -> locked -> off.
    function cycleMod(name) {
      const s = mod[name];
      if (!s.on) { s.on = true; s.lock = false; }
      else if (!s.lock) { s.lock = true; }
      else { s.on = false; s.lock = false; }
      renderMods();
    }
    function clearOneShot() {
      let changed = false;
      for (const name of ['ctrl', 'alt', 'shift']) {
        if (mod[name].on && !mod[name].lock) { mod[name].on = false; changed = true; }
      }
      if (changed) renderMods();
    }
    // Map a character under Ctrl to its ASCII control code (Ctrl+A -> 0x01 ...).
    function ctrlByte(ch) {
      let c = ch.charCodeAt(0);
      if (c >= 97 && c <= 122) c -= 32;                          // lower -> upper
      if (c >= 64 && c <= 95) return String.fromCharCode(c - 64); // @ A-Z [ backslash ] ^ _
      if (c === 32) return String.fromCharCode(0);                // Ctrl+Space -> NUL
      return ch;
    }
    function applyMods(ch) {
      let base = (mod.shift.on && ch.length === 1) ? ch.toUpperCase() : ch;
      let out = mod.ctrl.on ? ctrlByte(base) : base;
      if (mod.alt.on) out = ESC + out; // Alt = ESC prefix (xterm meta convention)
      return out;
    }
    // A single printable char from the OS keyboard or a tapped symbol key.
    function typeChar(ch) { sendInput(applyMods(ch)); clearOneShot(); }
    // A fixed control sequence (Esc, Tab, arrows, Fn...). Shift swaps in the
    // shifted variant (e.g. Tab -> BackTab); Alt still prepends ESC.
    function sendSeq(seq) {
      let out = (mod.shift.on && SHIFT_SEQ[seq]) ? SHIFT_SEQ[seq] : seq;
      if (mod.alt.on) out = ESC + out;
      sendInput(out);
      clearOneShot();
    }

    // Route OS soft-keyboard input through the modifier logic. Single chars get
    // Ctrl/Alt applied; multi-char input (paste, IME, or an ANSI sequence xterm
    // produced for a hardware key) passes through untouched.
    term.onData((data) => {
      if (data.length === 1 && (mod.ctrl.on || mod.alt.on || mod.shift.on)) { typeChar(data); return; }
      clearOneShot();
      sendInput(data);
    });

    // ---- Key tables ----
    const BS = String.fromCharCode(92); // backslash symbol
    const SYMBOLS = ['/', '-', '_', '~', '|', '&', ';', ':', '$', '#', '%', '*', '?', '!', '^', '=', '+', '.', ',', '@', '"', "'", '`', BS, '(', ')', '[', ']', '{', '}', '<', '>'];
    const SPECIALS = [
      ['Home', ESC + '[H'], ['End', ESC + '[F'],
      ['PgUp', ESC + '[5~'], ['PgDn', ESC + '[6~'],
      ['Del', ESC + '[3~'], ['Ins', ESC + '[2~'],
    ];
    const FKEYS = [
      ['F1', ESC + 'OP'], ['F2', ESC + 'OQ'], ['F3', ESC + 'OR'], ['F4', ESC + 'OS'],
      ['F5', ESC + '[15~'], ['F6', ESC + '[17~'], ['F7', ESC + '[18~'], ['F8', ESC + '[19~'],
      ['F9', ESC + '[20~'], ['F10', ESC + '[21~'], ['F11', ESC + '[23~'], ['F12', ESC + '[24~'],
    ];
    const ARROWS = { up: ESC + '[A', down: ESC + '[B', left: ESC + '[D', right: ESC + '[C' };

    // How far (px) a finger may travel between press and release and still count
    // as a tap. Beyond this it's a scroll of the key grid, so the key must NOT fire.
    const TAP_SLOP = 10;
    // preventDefault on pointerdown keeps focus on xterm's hidden textarea (so the
    // native keyboard doesn't dismiss), but we DEFER the actual keypress to
    // pointerup and only fire it if the finger didn't travel. Firing on pointerdown
    // (the old behaviour) meant a swipe to scroll the grid "pressed" whatever key it
    // began on. The grid scroll cancels our pointer (pointercancel) or moves it past
    // TAP_SLOP (pointermove) — either way the key is disarmed and stays silent.
    function makeKey(label, opts) {
      opts = opts || {};
      const b = document.createElement('button');
      b.className = 'kb-key' + (opts.cls ? ' ' + opts.cls : '');
      b.textContent = label;
      if (opts.id) b.id = opts.id;
      const fire = () => { if (opts.onTap) opts.onTap(); term.focus(); };
      if (opts.useClick) {
        // click already fires only on a genuine tap (never mid-scroll).
        b.addEventListener('click', fire);
        return b;
      }
      let sx = 0, sy = 0, tapping = false;
      b.addEventListener('pointerdown', (e) => { e.preventDefault(); sx = e.clientX; sy = e.clientY; tapping = true; });
      b.addEventListener('pointermove', (e) => {
        if (tapping && (Math.abs(e.clientX - sx) > TAP_SLOP || Math.abs(e.clientY - sy) > TAP_SLOP)) tapping = false;
      });
      b.addEventListener('pointerup', () => { if (tapping) { tapping = false; fire(); } });
      b.addEventListener('pointercancel', () => { tapping = false; });
      return b;
    }
    // Press-and-hold auto-repeat, used for arrows. Same tap/scroll discipline as
    // makeKey: a quick tap fires one key on release; a hold repeats after 350ms; a
    // swipe that scrolls the grid disarms it and sends nothing.
    function makeRepeatKey(label, seq) {
      const b = document.createElement('button');
      b.className = 'kb-key';
      b.textContent = label;
      let delayT = null, repT = null, sx = 0, sy = 0, tapping = false, repeated = false;
      const stop = () => { clearTimeout(delayT); clearInterval(repT); delayT = repT = null; };
      const disarm = () => { tapping = false; stop(); };
      b.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        sx = e.clientX; sy = e.clientY; tapping = true; repeated = false;
        delayT = setTimeout(() => {
          if (!tapping) return;
          repeated = true; sendSeq(seq);
          repT = setInterval(() => sendInput(seq), 90);
        }, 350);
        term.focus();
      });
      b.addEventListener('pointermove', (e) => {
        if (tapping && (Math.abs(e.clientX - sx) > TAP_SLOP || Math.abs(e.clientY - sy) > TAP_SLOP)) disarm();
      });
      b.addEventListener('pointerup', () => { if (tapping && !repeated) sendSeq(seq); disarm(); });
      b.addEventListener('pointerleave', disarm);
      b.addEventListener('pointercancel', disarm);
      return b;
    }

    const kbGrid = document.getElementById('kb-grid');
    const addKey = (node) => kbGrid.appendChild(node);
    const addDivider = () => { const d = document.createElement('div'); d.className = 'kb-divider'; kbGrid.appendChild(d); };

    // Row 1: modifiers + Esc.
    addKey(makeKey('Ctrl', { id: 'mod-ctrl', cls: 'mod', onTap: () => cycleMod('ctrl') }));
    addKey(makeKey('Alt', { id: 'mod-alt', cls: 'mod', onTap: () => cycleMod('alt') }));
    addKey(makeKey('Shift', { id: 'mod-shift', cls: 'mod', onTap: () => cycleMod('shift') }));
    addKey(makeKey('Esc', { onTap: () => sendSeq(ESC) }));
    // Row 2: the everyday editing keys. Enter/Backspace/Tab go through sendSeq so
    // Alt and Shift compose (Shift+Tab is BackTab; Alt+Backspace deletes a word).
    addKey(makeKey('Tab', { onTap: () => sendSeq(TAB) }));
    addKey(makeKey('⌫', { onTap: () => sendSeq(String.fromCharCode(127)) }));   // Backspace (DEL)
    addKey(makeKey('Space', { onTap: () => typeChar(' ') }));
    addKey(makeKey('Enter', { onTap: () => sendSeq(String.fromCharCode(13)) })); // CR
    // Row 3: arrows (press-and-hold to auto-repeat).
    addKey(makeRepeatKey('←', ARROWS.left));
    addKey(makeRepeatKey('↑', ARROWS.up));
    addKey(makeRepeatKey('↓', ARROWS.down));
    addKey(makeRepeatKey('→', ARROWS.right));
    addDivider();
    // Navigation + editing: Home End PgUp PgDn Del Ins, then ^C and Paste.
    for (const sp of SPECIALS) addKey(makeKey(sp[0], { onTap: () => sendSeq(sp[1]) }));
    addKey(makeKey('^C', { onTap: () => sendInput(String.fromCharCode(3)) }));
    addKey(makeKey('Paste', { useClick: true, onTap: async () => {
      try { sendInput(await navigator.clipboard.readText()); setStatus('pasted'); }
      catch (e) { setStatus('clipboard blocked by browser'); }
    } }));
    // Alt+V (ESC v) — Claude Code's "paste image from clipboard" shortcut.
    addKey(makeKey('Alt+V', { onTap: () => sendInput(ESC + 'v') }));
    // Full-width key that raises the phone's native keyboard for free-text
    // typing. Uses click (no preventDefault) so focusing xterm's textarea is
    // allowed to open the soft keyboard; the visualViewport watcher then hides
    // this panel while it is up.
    addKey(makeKey('⌨  keyboard', { cls: 'wide', useClick: true, onTap: () => term.focus() }));
    addDivider();
    // Symbols.
    for (const s of SYMBOLS) addKey(makeKey(s, { cls: 'sym', onTap: () => typeChar(s) }));
    addDivider();
    // Function keys.
    for (const f of FKEYS) addKey(makeKey(f[0], { onTap: () => sendSeq(f[1]) }));

    window.addEventListener('resize', scheduleResize);
    window.addEventListener('orientationchange', scheduleResize);
    renderMods();

    // Pin the app to the *visible* viewport. The native keyboard covers the
    // bottom of the screen without shrinking the layout viewport, so without
    // this the terminal (and its live prompt) hides behind it. Match the body
    // height to visualViewport, hide our on-screen keyboard while the native one
    // is up (body.osk-up), and keep the prompt scrolled into view.
    (function syncViewport() {
      const vv = window.visualViewport;
      if (!vv) return;
      const apply = () => {
        document.body.style.height = vv.height + 'px';
        const covered = window.innerHeight - vv.height - vv.offsetTop;
        document.body.classList.toggle('osk-up', covered > 120);
        const pinned = isAtBottom();
        scheduleResize();
        if (pinned) { try { term.scrollToBottom(); } catch (e) {} }
      };
      vv.addEventListener('resize', apply);
      vv.addEventListener('scroll', apply);
      apply();
    })();

    fitAndResize();
    // ---- Access-code login (shown on 401 when we have no valid token) ----
    const loginEl = document.getElementById('login');
    const loginInput = document.getElementById('login-input');
    const loginErr = document.getElementById('login-err');
    function showLogin(msg) {
      if (loginErr) loginErr.textContent = msg || '';
      if (loginEl) loginEl.classList.add('show');
      setTimeout(() => { try { loginInput.focus(); } catch (e) {} }, 50);
    }
    function hideLogin() { if (loginEl) loginEl.classList.remove('show'); }
    // applyToken stores an access code (from typing OR scanning) and reconnects.
    function applyToken(code) {
      token = code;
      try { localStorage.setItem('moona_token', code); } catch (e) {}
      hideLogin();
      setStatus('connecting...');
      refreshSessions().then(() => { if (activeId) connect(); });
    }
    function submitLogin() {
      const code = (loginInput.value || '').trim();
      if (!code) { showLogin('Enter the code.'); return; }
      applyToken(code);
    }
    document.getElementById('login-go').addEventListener('click', submitLogin);
    loginInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitLogin(); });

    // ---- Scan-to-connect: read the terminal QR with the phone camera and pull
    // the access code out of it, so nobody has to type the 32-char token. The QR
    // encodes the full URL (…/?token=CODE); we decode it in-page with jsQR (loaded
    // lazily, same CDN as xterm) and feed the token straight into applyToken().
    const scannerEl = document.getElementById('scanner');
    const scanVideo = document.getElementById('scan-video');
    const scanHint = document.getElementById('scan-hint');
    const scanCanvas = document.createElement('canvas');
    let scanStream = null, scanRAF = 0, jsqrPromise = null;

    function loadJsQR() {
      if (window.jsQR) return Promise.resolve(window.jsQR);
      if (jsqrPromise) return jsqrPromise;
      jsqrPromise = new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
        s.onload = () => resolve(window.jsQR);
        s.onerror = () => { jsqrPromise = null; reject(new Error('load failed')); };
        document.head.appendChild(s);
      });
      return jsqrPromise;
    }

    // extractToken pulls the access code out of whatever the QR decodes to: a full
    // moona URL (?token=…), a bare "token=…" fragment, or the raw code itself.
    function extractToken(text) {
      if (!text) return '';
      try { const q = new URL(text, location.origin).searchParams.get('token'); if (q) return q; } catch (e) {}
      const m = String(text).match(/token=([A-Za-z0-9._~-]+)/);
      if (m) return m[1];
      const s = String(text).trim();
      if (/^[A-Za-z0-9]{8,}$/.test(s)) return s;
      return '';
    }

    function stopScan() {
      scannerEl.classList.remove('show');
      if (scanRAF) { cancelAnimationFrame(scanRAF); scanRAF = 0; }
      if (scanStream) { scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
      scanVideo.srcObject = null;
    }

    function onScanResult(text) {
      const t = extractToken(text);
      stopScan();
      if (!t) { showLogin("That QR didn't contain an access code — try again, or type the code."); return; }
      applyToken(t);
    }

    async function startScan() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showLogin("This browser can't open the camera — type the code instead."); return;
      }
      let jsQRfn;
      try { jsQRfn = await loadJsQR(); }
      catch (e) { showLogin("Couldn't load the scanner — type the code instead."); return; }
      try {
        scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
      } catch (e) {
        showLogin('Camera blocked — allow camera access, or type the code.'); return;
      }
      scanVideo.srcObject = scanStream;
      try { await scanVideo.play(); } catch (e) {}
      scannerEl.classList.add('show');
      const ctx = scanCanvas.getContext('2d', { willReadFrequently: true });
      const tick = () => {
        if (!scannerEl.classList.contains('show')) return;
        if (scanVideo.readyState === scanVideo.HAVE_ENOUGH_DATA && scanVideo.videoWidth) {
          const w = scanVideo.videoWidth, h = scanVideo.videoHeight;
          scanCanvas.width = w; scanCanvas.height = h;
          ctx.drawImage(scanVideo, 0, 0, w, h);
          let img = null;
          try { img = ctx.getImageData(0, 0, w, h); } catch (e) {}
          if (img) {
            const code = jsQRfn(img.data, w, h, { inversionAttempts: 'attemptBoth' });
            if (code && code.data) { onScanResult(code.data); return; }
          }
        }
        scanRAF = requestAnimationFrame(tick);
      };
      scanRAF = requestAnimationFrame(tick);
    }

    document.getElementById('login-scan').addEventListener('click', startScan);
    document.getElementById('scan-cancel').addEventListener('click', () => { stopScan(); showLogin(''); });

    const addtabEl = document.getElementById('addtab');
    if (addtabEl) addtabEl.addEventListener('click', addSession);

    // Discover sessions once, then connect. While connected, tab changes arrive as
    // pushed {type:'sessions'} frames over the WebSocket (no polling — this keeps a
    // metered tunnel like ngrok well under its request cap). We only fall back to
    // polling while there is NO open socket (e.g. the empty state), so a session
    // started on the PC still appears on an idle phone.
    refreshSessions().then(() => { if (activeId) connect(); });
    setInterval(() => {
      if (!ws || ws.readyState !== WebSocket.OPEN) refreshSessions();
    }, 6000);
  </script>
</body>
</html>
